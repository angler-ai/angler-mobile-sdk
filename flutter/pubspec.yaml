name: angler_analytics
description: Angler app analytics and attribution for Flutter (iOS and Android), over the native Angler SDKs.
version: 0.1.0-rc.4
homepage: https://getangler.ai
repository: https://github.com/angler-ai/angler-mobile-sdk

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  plugin:
    platforms:
      android:
        package: ai.getangler.analytics.flutter
        pluginClass: AnglerAnalyticsPlugin
      ios:
        pluginClass: AnglerAnalyticsPlugin
