// Android side of the angler_analytics Flutter plugin. Depends on the Kotlin core from Maven at
// the same version as this package (pubspec.yaml).
group 'ai.getangler.analytics.flutter'
version '1.0'

def pubspec = file('../pubspec.yaml').text
def anglerVersion = (pubspec =~ /(?m)^version:\s*(\S+)/)[0][1]

buildscript {
    ext.kotlin_version = '2.0.21'
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.3'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace 'ai.getangler.analytics.flutter'
    compileSdk 35

    defaultConfig {
        minSdk 21
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = '11'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
        test.java.srcDirs += 'src/test/kotlin'
    }
}

dependencies {
    implementation "ai.getangler:analytics:$anglerVersion"

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
