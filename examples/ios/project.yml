# Regenerate AnglerExample.xcodeproj with: cd examples/ios && xcodegen
name: AnglerExample
options:
  bundleIdPrefix: ai.getangler.example
  deploymentTarget:
    iOS: "15.0"
packages:
  AnglerAnalytics:
    path: ../..
configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig
targets:
  AnglerExample:
    type: application
    platform: iOS
    sources: [AnglerExample]
    dependencies:
      - package: AnglerAnalytics
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.getangler.example.ios
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
    info:
      path: AnglerExample/Info.plist
      properties:
        CFBundleDisplayName: Angler Example
        UILaunchScreen: {}
        NSUserTrackingUsageDescription: Used to measure which ads brought you to the app.
        AnglerWorkspaceId: $(ANGLER_WORKSPACE_ID)
        AnglerToken: $(ANGLER_TOKEN)
        CFBundleURLTypes:
          - CFBundleURLName: ai.getangler.example
            CFBundleURLSchemes: [anglerexample]
