name: Sync docs site

# Copies site/mobile-sdk.md to the public docs (angler-ai/angler-docs, published by ReadMe) as
# "Sending Data to Angler AI → Mobile SDK", by opening or updating a PR on the
# sync/angler-mobile-sdk branch there. See site/README.md.
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/sync-docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-docs
  cancel-in-progress: false

env:
  DOCS_REPO: angler-ai/angler-docs
  DOCS_BRANCH: v1.0
  SYNC_BRANCH: sync/angler-mobile-sdk
  SECTION: docs/Sending Data to Angler AI
  SLUG: mobile-sdk
  # The page is listed after this one in the section's _order.yaml (or last, if it's gone).
  ORDER_AFTER: send-appsflyer-data-to-angler-via-push-api

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check the token
        env:
          TOKEN: ${{ secrets.ANGLER_DOCS_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Add the ANGLER_DOCS_TOKEN secret (Contents and Pull requests read/write on $DOCS_REPO). See site/README.md."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          path: sdk
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.DOCS_REPO }}
          ref: ${{ env.DOCS_BRANCH }}
          token: ${{ secrets.ANGLER_DOCS_TOKEN }}
          path: docs-site
      - name: Copy the page and list it in its section
        working-directory: docs-site
        run: |
          cp "../sdk/site/$SLUG.md" "$SECTION/$SLUG.md"
          order="$SECTION/_order.yaml"
          if ! grep -qxF -- "- $SLUG" "$order"; then
            if grep -qxF -- "- $ORDER_AFTER" "$order"; then
              sed -i "/^- $ORDER_AFTER\$/a - $SLUG" "$order"
            else
              echo "- $SLUG" >> "$order"
            fi
          fi
          git status --short
      - name: Open or update the PR
        working-directory: docs-site
        env:
          GH_TOKEN: ${{ secrets.ANGLER_DOCS_TOKEN }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "The docs already match site/; nothing to do."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$SYNC_BRANCH"
          git add -A
          git commit -m "Sync the Mobile SDK page from angler-mobile-sdk@${GITHUB_SHA::7}"
          git push --force origin "$SYNC_BRANCH"
          open=$(gh pr list --repo "$DOCS_REPO" --head "$SYNC_BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$open" ]; then
            echo "Updated $DOCS_REPO#$open."
          else
            gh pr create --repo "$DOCS_REPO" --base "$DOCS_BRANCH" --head "$SYNC_BRANCH" \
              --title "Sync the Mobile SDK page" \
              --body "Synced from [\`site/$SLUG.md\`]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/$GITHUB_SHA/site/$SLUG.md) in $GITHUB_REPOSITORY by its \`sync-docs\` workflow. Edit the page there: changes made here are overwritten by the next sync."
          fi
