name: CI

# Runs each platform's checks only when its files (or the shared spec) change.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      spec: ${{ steps.filter.outputs.spec }}
      ios: ${{ steps.filter.outputs.ios }}
      android: ${{ steps.filter.outputs.android }}
      rn: ${{ steps.filter.outputs.rn }}
      flutter: ${{ steps.filter.outputs.flutter }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            spec:
              - 'spec/**'
            ios:
              - 'ios/**'
              - 'Package.swift'
              - 'spec/**'
            android:
              - 'android/**'
              - 'spec/**'
            rn:
              - 'react-native/**'
              - 'ios/**'
              - 'android/**'
              - 'spec/**'
            flutter:
              - 'flutter/**'
              - 'ios/**'
              - 'android/**'
              - 'spec/**'

  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: All packages share VERSION
        run: node scripts/sync-version.mjs --check
      - name: sync-version tests
        run: node --test scripts/test/

  spec:
    needs: changes
    if: needs.changes.outputs.spec == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spec
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm test

  ios:
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests (macOS host)
        run: swift test
      - name: Unit tests (iOS simulator)
        run: xcodebuild test -scheme AnglerAnalytics -destination 'platform=iOS Simulator,name=iPhone 16'

  android:
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :angler-analytics:testDebugUnitTest :angler-analytics:lint

  rn:
    needs: changes
    if: needs.changes.outputs.rn == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: react-native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx jest
      - run: npx tsc --noEmit
      - name: Swift core copy and npm tarball contents
        run: node --test scripts/__tests__/

  flutter:
    needs: changes
    if: needs.changes.outputs.flutter == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.24.x
          channel: stable
      - run: flutter test
      - run: flutter analyze
      - name: pub archive includes the Swift core
        run: scripts/sync_native.sh && scripts/check_package.sh
